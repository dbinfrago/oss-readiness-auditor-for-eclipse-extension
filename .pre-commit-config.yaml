# uvx pre-commit install   ·   uvx pre-commit run --all-files

repos:
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.3.0
    hooks:
      - id: reuse

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: unit-tests
        name: unit tests
        entry: uv run --frozen python -m unittest discover -s tests
        language: system
        pass_filenames: false
        files: ^(src|tests|scripts)/
