# oss-readiness-auditor: rule source
#
# Rule pack 'eclipse'.
# bundle_to_maven: Eclipse Orbit and other repackaged OSGi bundles that carry no Maven metadata, mapped to Maven
# coordinates so that their version can be matched against OSV.

about = 'Eclipse/OSGi/Tycho conventions: MANIFEST.MF, plugin.xml, feature.xml, .product, about.html, launch arguments, Orbit bundle names.'
default = true

# Public domains: hosts under them are not reported.
public_hosts = [
    'eclipse.org',
    'eclipse.dev',
    'eclipsecon.org',
    'polarsys.org',
    'eclipse-ee4j.github.io',
    'jakarta.ee',
    'osgi.org',
    'obeo.fr',
    'xtext.org',
]

