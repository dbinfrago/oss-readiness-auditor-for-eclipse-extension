# oss-readiness-auditor: rule source
#
# Rule pack 'core'.
# Standards bodies, open-source foundations and forges, package registries, large vendors' documentation and schema
# hosts, and domains reserved for examples are public by nature.

about = 'Generic open-source hygiene: licenses, credentials, hosts, personal data, project files.'
default = true
locked = true  # cannot be disabled

# Public domains: hosts under them are not reported.
public_hosts = [
    'w3.org',
    'omg.org',
