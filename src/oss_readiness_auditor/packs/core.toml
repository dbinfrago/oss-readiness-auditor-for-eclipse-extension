# Host-name parts that make a host 'internal-looking'.
internal_host_hints = [
    'gitlab',
    'gitea',
    'idp',
    'sso',
    'intranet',
    'internal',
    'corp',
    'vpn',
    'ldap',
    'local',
    'dev',
    'uat',
    'staging',
    'preprod',
    'lan',
    'priv',
]

# Name roots that belong to a foundation: bundles and packages under them claim the foundation's namespace (and
# often its trademark). Projects hosted there confirm it with project.hosted_by.
[foundations]
"org.eclipse" = 'Eclipse Foundation'
"org.polarsys" = 'Eclipse Foundation (PolarSys)'
"org.osgi" = 'OSGi Working Group (Eclipse Foundation)'
"jakarta" = 'Eclipse Foundation (Jakarta EE)'
"org.apache" = 'Apache Software Foundation'
"org.ow2" = 'OW2'
"org.jenkins-ci" = 'Jenkins project (Continuous Delivery Foundation)'
