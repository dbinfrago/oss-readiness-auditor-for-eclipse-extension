# Rule pack 'rail'.

about = 'Railway domain: railML infrastructure data files.'
default = false

# Public domains: hosts under them are not reported.
public_hosts = [
    'railml.org',
]

[[data_files]]
name = 'railML'
extensions = ['.railml']
root = 'railml'
